name: near_hub
version: "1.0.0"
profile: near_hub
config-version: 2

flags:
  send_anonymous_usage_stats: false
  version_check: false

model-paths: ["warehouse/models"]
macro-paths: ["warehouse/macros"]
test-paths: ["warehouse/tests"]
seed-paths: ["registry"]

models:
  near_hub:
    silver:
      +schema: silver
      +materialized: table
    gold:
      +schema: gold
      +materialized: table

seeds:
  near_hub:
    +schema: registry
    entities:
      +column_types:
        account_id: varchar
        tier: integer
        track_holdings: integer
        track_contract_stats: integer
        crawl_transfers: integer
    tokens:
      +column_types:
        token_id: varchar
        decimals: integer
        track_holders: integer
    dune_queries:
      +column_types:
        query_id: bigint
    events:
      +column_types:
        event_date: date
    near_supply_readings:
      +column_types:
        reading_date: date
        value: double
    peer_supply_readings:
      +column_types:
        reading_date: date
        total_supply_tokens: double
    swap_services:
      +column_types:
        llama_id: varchar
        volume_365d_usd_at_selection: double
        selected_on: date
    token_prices:
      +column_types:
        share_of_pool_at_selection: double
        pool_day_at_selection: date
        source_asset_id: varchar
        first_price_day: date
    protocol_upgrades:
      +column_types:
        protocol_version: integer
        first_block_height: bigint
        first_block_utc: timestamp
        contract_gas_reward_rate_before: double
        contract_gas_reward_rate_after: double
    issuance_scenarios:
      +column_types:
        annual_issuance_rate: double
    governance_decisions:
      +column_types:
        proposal_id: integer
        hsp: varchar
        short_name: varchar
        near_committed: double
        usd_committed: double
        ramp_months: integer
        grace_days: integer
        in_force_date: date
        in_force_protocol_version: integer
        source_url: varchar
    claims:
      +column_types:
        threshold: double
    etf_nrr_history:
      +column_types:
        date_day: date
        nav_usd: double
        market_price_usd: double
        flow_shares: bigint
        reported_flow_usd: double
        reported_cumulative_usd: double
        reported_net_assets_usd: double
        near_in_trust: double

vars:
  # Latest snapshot the build may read. Later snapshots are ignored, so a pinned build never drifts.
  # `make warehouse` passes the date from data/PINNED when that file exists.
  as_of: "9999-12-31"
  # A day's Intents fee and revenue figures can change until they are read this many nights after the day ended.
  # Measured on 2026-11-05 from every snapshot; see docs/audits/DATA_AUDIT_2026-11-05.md, finding 10. If you change it, change
  # the descriptions of is_fee_revenue_provisional on fct_intents_daily and fct_peer_daily, which state the number.
  intents_fee_settle_nights: 3
  # Percent of the larger price. When 1Click and Rhea price a token this far apart, fct_wallet_holdings leaves its value empty.
  # On 2026-11-01 to 11-05 two of the 26 tokens both price passed this, and the next largest gap was 10.7%.
  price_disagreement_pct: 20
  # A token nobody has vetted gets a value only up to this many times the vetted assets opposite it in Rhea's pools. A pool's
  # own reserves read about 1, and 90% read under 1.4. The result hardly depends on this number; see docs/SOURCES.md.
  price_depth_multiple: 3
