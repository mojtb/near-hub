      - {name: market_cap_usd, description: "Market cap: CoinMetrics, else NearBlocks. CoinMetrics' estimate tracked circulating supply until September 2025 and has equalled price times total supply since November 2025, so recent values are fully diluted. See circulating_supply_latest_nearblocks_vs_coinmetrics in dq_reconciliation.", meta: {unit: "USD"}}
      - {name: price_usd_coinmetrics, description: "CoinMetrics reference rate at the day's close.", meta: {unit: "USD"}}
      - {name: price_usd_coinbase_close, description: "Coinbase NEAR-USD close.", meta: {unit: "USD"}}
      - {name: price_usd_defillama, description: "DefiLlama price, moved back one day from its 00:00 stamp to align with the close.", meta: {unit: "USD"}}
      - {name: price_usd_nearblocks, description: "NearBlocks price, moved back one day from its 00:00 stamp to align with the close.", meta: {unit: "USD"}}
      - {name: open_usd, description: "Coinbase open.", meta: {unit: "USD"}}
      - {name: high_usd, description: "Coinbase high.", meta: {unit: "USD"}}
      - {name: low_usd, description: "Coinbase low.", meta: {unit: "USD"}}
      - {name: coinbase_volume_near, description: "Coinbase traded volume.", meta: {unit: "NEAR"}}
      - {name: reported_spot_volume_usd, description: "Reported spot volume per CoinMetrics.", meta: {unit: "USD"}}
      - {name: circulating_supply_near, description: "Circulating supply per /v1/charts. The v3 stats endpoint reports this wrongly, so it is not used. Stale: the value has read 1,249,836,992 on every day since 2025-08-27, so treat it as unknown from then on.", meta: {unit: "NEAR"}}
  - name: fct_token_prices
    description: "Point in time: one USD price per token per read, chosen from 1Click and Rhea on the token's id, never its symbol. 1Click wins where it has a positive price, because 139 of its 152 tokens carry a market feed's id, while Rhea's list is one DEX's pools. A price of 0 or below on either list counts as no price. Tokens with no positive price on either list have no row. native:near takes wrap.near's price, because one redeems for the other one to one. Most of Rhea's list is stale or thin: 4,309 of the 4,609 tokens on all five reads to 2026-11-05 kept one unchanged price while NEAR moved 11%, and one token reads $1.36 trillion. So read price_date and depth_usd before using a Rhea price."
    config:
      meta: {grain: "snapshot_date, token_id", sources: "1Click /v0/tokens, Rhea list-token-price, Rhea list-top-pools, registry/tokens.csv"}
    data_tests:
      - unique_grain: {arguments: {columns: ["snapshot_date", "token_id"]}}
      - min_rows: {arguments: {n: 1000}}
    columns:
      - {name: snapshot_date, description: "Date the lists were read. On the 11-05 run the two lists were read about four minutes apart.", meta: {unit: "date"}, data_tests: [not_null]}
      - {name: token_id, description: "Token contract, as fct_wallet_holdings names it, or native:near. For 1Click this is the NEAR contract its asset id names, so bridged assets count too: USDC on Ethereum is eth-0xa0b86991c6218b36c1d19d4a2e9eb0ce3606eb48.omft.near.", meta: {unit: "token id"}, data_tests: [not_null]}
      - {name: price_usd, description: "The price to use: 1Click's if positive, otherwise Rhea's. Per whole token, counted with price_decimals.", meta: {unit: "USD per token"}, data_tests: [not_null]}
      - {name: price_source, description: "Which list price_usd came from: oneclick or rhea.", meta: {unit: "text"}, data_tests: [not_null, {accepted_values: {arguments: {values: ["oneclick", "rhea"]}}}]}
      - {name: price_date, description: "When price_usd was last set, as far as its list shows. For 1Click, the date of its priceUpdatedAt. Rhea gives no time, so this is the first read showing this exact price, digit by digit. Earlier than snapshot_date means the price has not changed since then, and it can never read earlier than Rhea's first read, 2026-11-01.", meta: {unit: "date"}, data_tests: [not_null]}
      - {name: price_decimals, description: "The decimals the chosen list uses for this token. A price is per whole token in these decimals, so a holding counted with different decimals cannot use it.", meta: {unit: "integer"}}
      - {name: price_usd_oneclick, description: "1Click's price. Empty if 1Click does not list the token or lists it at 0, which it did for six tokens on 2026-11-05.", meta: {unit: "USD per token"}}
      - {name: price_usd_rhea, description: "Rhea's price. Empty if Rhea does not list the token or lists it at 0.", meta: {unit: "USD per token"}}
      - {name: price_gap_pct, description: "How far apart the two lists are, as a percent of the larger price. Empty unless both have a positive price. Above the project's price_disagreement_pct (20), fct_wallet_holdings leaves the value empty.", meta: {unit: "percent"}, data_tests: [{in_range: {arguments: {low: 0, high: 100}}}]}
      - {name: depth_usd, description: "Assets with a vetted price opposite this token, summed over Rhea's pools at this read. This is the real money behind a pool price: in a constant-product pool, selling any amount cannot take out more than the other side. It does not use Rhea's own tvl field, which reads $1.37B for one pool of two unknown tokens. It leaves out concentrated-liquidity (DCL) pools, which Rhea's pool list does not include, so a token traded only there reads 0.", meta: {unit: "USD"}, data_tests: [not_null, {in_range: {arguments: {low: 0, high: 1000000000}}}]}
      - {name: is_vetted, description: "True if 1Click has a positive price for the token or registry/tokens.csv lists it. Only these prices count toward depth_usd, and only these tokens can be valued beyond their depth.", meta: {unit: "boolean"}, data_tests: [not_null]}
  - name: fct_mpc_participants
    description: "MPC operators per snapshot, read directly from v1.signer."
    config:
      meta: {grain: "snapshot_date, operator_account_id", sources: "RPC v1.signer state"}
    data_tests:
      - unique_grain: {arguments: {columns: ["snapshot_date", "operator_account_id"]}}
      - min_rows: {arguments: {n: 10}}
    columns:
      - {name: snapshot_date, description: "Date the source was read.", meta: {unit: "date"}, data_tests: [not_null]}
      - {name: operator_account_id, description: "MPC operator account.", meta: {unit: "account id"}, data_tests: [not_null]}
      - {name: participant_id, description: "Operator's id in the contract.", meta: {unit: "integer"}}
  - name: fct_mpc_state
    description: "Chain Signatures contract state per snapshot, read directly from v1.signer."
    config:
      meta: {grain: "snapshot_date", sources: "RPC v1.signer state"}
    data_tests:
      - unique_grain: {arguments: {columns: ["snapshot_date"]}}
      - min_rows: {arguments: {n: 1}}
    columns:
      - {name: snapshot_date, description: "Date the source was read.", meta: {unit: "date"}, data_tests: [not_null]}
      - {name: participants, description: "MPC participants.", meta: {unit: "count"}}
      - {name: threshold, description: "Signers required.", meta: {unit: "count"}}
      - {name: signature_domains, description: "Signature schemes supported.", meta: {unit: "count"}}
      - {name: keyset_epoch, description: "MPC key generation epoch.", meta: {unit: "integer"}}
  - name: fct_peer_daily
    description: "NEAR and peer chains per day on the same definitions. An empty cell means the source has no value for that day. The fees and revenue of the newest days can still change; see is_fee_revenue_provisional."
    config:
      meta: {grain: "date_day, chain_id", sources: "DefiLlama, CoinMetrics"}
    data_tests:
      - unique_grain: {arguments: {columns: ["date_day", "chain_id"]}}
      - min_rows: {arguments: {n: 5000}}
    columns:
      - {name: date_day, description: "UTC calendar day.", meta: {unit: "date"}, data_tests: [not_null]}
      - {name: chain_id, description: "Chain identifier from registry/peers.csv.", meta: {unit: "id"}, data_tests: [not_null]}
      - {name: price_usd, description: "Close: CoinMetrics, else DefiLlama.", meta: {unit: "USD"}}
      - {name: market_cap_usd, description: "Market cap per CoinMetrics. Empty for TON, which has no community series. For NEAR it has equalled price times total supply since late 2025; see fct_market_daily.", meta: {unit: "USD"}}
      - {name: tvl_usd, description: "Chain TVL per DefiLlama. DefiLlama can rewrite a chain's history on any night without notice, so no value is ever final and a TVL chart reproduces only at a pin. Its 2026-11-03 read moved 2,079 Ethereum and Solana days back to 2021, by up to 11.4%. Other reads through 2026-11-05 moved at most 8 days by more than 0.01%, and NEAR's series has not moved. See dq_revisions.", meta: {unit: "USD"}}
      - {name: fees_usd, description: "Fees paid by users on the chain per DefiLlama. DefiLlama also rewrites older days: its 2026-11-04 and 11-05 reads moved 165 and 557 of Solana's days, back to 2025-04-09, by up to 5.6%.", meta: {unit: "USD"}}
      - {name: revenue_usd, description: "Chain revenue per DefiLlama.", meta: {unit: "USD"}}
      - {name: dex_volume_usd, description: "DEX volume on the chain per DefiLlama.", meta: {unit: "USD"}}
      - {name: stablecoins_usd, description: "Stablecoins on the chain per DefiLlama.", meta: {unit: "USD"}}
      - {name: is_fee_revenue_provisional, description: "True while this day's fees_usd and revenue_usd can still change, by the rule on fct_intents_daily: until they have been read 3 nights after the day ended, so the newest two days of a nightly build. NEAR's fees are mostly Intents fees and settle with them: they read $33,285 for 2026-10-31 and $146,822 two nights later. Every chain gets the same rule, so filtering on this column cuts them all at the same day. The other chains' first reads also run low, by up to about 6% for fees on Ethereum, Solana and Sui, but they have no fixed settling time, so False does not mean settled for them. A data test holds the number for NEAR only.", meta: {unit: "boolean"}, data_tests: [not_null]}
  - name: fct_protocol_config
    description: "Protocol parameters as read on each snapshot date. A change between rows is a protocol change."
    config:
      meta: {grain: "snapshot_date", sources: "RPC EXPERIMENTAL_protocol_config"}
    data_tests:
      - unique_grain: {arguments: {columns: ["snapshot_date"]}}
      - min_rows: {arguments: {n: 1}}
    columns:
      - {name: snapshot_date, description: "Date the source was read.", meta: {unit: "date"}, data_tests: [not_null]}
      - {name: protocol_version, description: "Protocol version.", meta: {unit: "integer"}}
      - {name: max_inflation_rate, description: "Maximum annual inflation parameter.", meta: {unit: "fraction per year"}}
      - {name: protocol_reward_rate, description: "Share of issuance sent to the protocol treasury.", meta: {unit: "fraction"}}
      - {name: contract_gas_reward_rate, description: "Share of function-call gas paid to the called contract.", meta: {unit: "fraction"}}
      - {name: gas_burn_rate, description: "One minus contract_gas_reward_rate.", meta: {unit: "fraction"}}
      - {name: epoch_length_blocks, description: "Epoch length.", meta: {unit: "blocks"}}
      - {name: block_producer_seats, description: "Block producer seats.", meta: {unit: "count"}}
      - {name: blocks_per_year_setting, description: "Blocks per year used in the reward formula.", meta: {unit: "blocks"}}
      - {name: shard_count, description: "Number of shards.", meta: {unit: "count"}}
      - {name: storage_yocto_per_byte, description: "Storage staking cost.", meta: {unit: "yoctoNEAR per byte"}}
      - {name: min_gas_price_yocto, description: "Minimum gas price parameter.", meta: {unit: "yoctoNEAR per gas"}}
      - {name: protocol_treasury_account, description: "Account that receives the protocol reward share.", meta: {unit: "account id"}}
  - name: fct_protocol_fees_snapshot
    description: "Fees and revenue per protocol on NEAR, as of each DefiLlama reading."
    config:
      meta: {grain: "snapshot_date, measure, protocol_name", sources: "DefiLlama /overview/fees/Near"}
    data_tests:
      - unique_grain: {arguments: {columns: ["snapshot_date", "measure", "protocol_name"]}}
      - min_rows: {arguments: {n: 10}}
    columns:
      - {name: snapshot_date, description: "Date the source was read.", meta: {unit: "date"}, data_tests: [not_null]}
      - {name: measure, description: "fees or revenue.", meta: {unit: "text"}, data_tests: [not_null]}
      - {name: protocol_name, description: "Protocol name.", meta: {unit: "text"}, data_tests: [not_null]}
      - {name: protocol_slug, description: "DefiLlama protocol identifier.", meta: {unit: "id"}}
      - {name: category, description: "DefiLlama category.", meta: {unit: "text"}}
      - {name: total_24h_usd, description: "Trailing 24 hours.", meta: {unit: "USD"}}
      - {name: total_7d_usd, description: "Trailing 7 days.", meta: {unit: "USD"}}
      - {name: total_30d_usd, description: "Trailing 30 days.", meta: {unit: "USD"}}
      - {name: total_1y_usd, description: "Trailing year.", meta: {unit: "USD"}}
      - {name: total_all_time_usd, description: "All time.", meta: {unit: "USD"}}
  - name: fct_protocol_tvl_daily
    description: "TVL on NEAR per protocol per day, excluding exchange wallets. A protocol is one DefiLlama id, so a rename, which changes the slug and keeps the id, joins the old slug's days to the new slug's and counts the protocol once. A protocol missing from the newest reading keeps its history and its days stop, because a missed night and a delisting look the same. Two ids carrying one series fail the test no_two_protocols_share_a_tvl_series. Liquid staking and lending can count the same NEAR twice, so do not sum categories into a chain total. DefiLlama can rewrite TVL history without notice, as it did for Ethereum and Solana on 2026-11-03 (see fct_peer_daily.tvl_usd), so no value here is final either, although no protocol on NEAR had moved through 2026-11-05."
    config:
      meta: {grain: "date_day, protocol_id", sources: "DefiLlama /protocol/{slug}"}
    data_tests:
      - unique_grain: {arguments: {columns: ["date_day", "protocol_id"]}}
      - unique_grain: {arguments: {columns: ["date_day", "protocol_slug"]}}
      - min_rows: {arguments: {n: 5000}}
    columns:
      - {name: date_day, description: "UTC calendar day.", meta: {unit: "date"}, data_tests: [not_null]}
      - {name: protocol_id, description: "DefiLlama's id for the protocol. It stays the same when the protocol is renamed.", meta: {unit: "id"}, data_tests: [not_null]}
      - {name: protocol_slug, description: "DefiLlama's URL name for the protocol, as of the newest reading that listed it. It can change.", meta: {unit: "id"}, data_tests: [not_null]}
      - {name: protocol_name, description: "Protocol name.", meta: {unit: "text"}}
      - {name: category, description: "DefiLlama category.", meta: {unit: "text"}}
      - {name: tvl_usd, description: "Total value locked.", meta: {unit: "USD"}}
  - name: fct_receiver_sample_daily
    description: "Activity per receiver, estimated from evenly spaced sample blocks. These are estimates, and a day's sample density is in blocks_sampled."
