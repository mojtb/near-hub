          - {token_id: "near-enough.near", symbol: "NEAR1", decimals: 6, is_latest: true}
      - input: ref('fct_token_prices')
        rows:
          - {snapshot_date: "2026-11-05", token_id: "native:near", price_usd: 4.0, price_source: "oneclick", price_date: "2026-11-05", price_decimals: 24, depth_usd: 1000.0, is_vetted: true}
          - {snapshot_date: "2026-11-05", token_id: "wrap.near", price_usd: 4.0, price_source: "oneclick", price_date: "2026-11-05", price_decimals: 24, depth_usd: 1000.0, is_vetted: true}
          # USDC's own price is here, so a join on symbol would value usdc-fake.near at 1.0 and not 0.25.
          - {snapshot_date: "2026-11-05", token_id: "usdc.real", price_usd: 1.0, price_source: "oneclick", price_date: "2026-11-05", price_decimals: 6, depth_usd: 1000.0, is_vetted: true}
          - {snapshot_date: "2026-11-05", token_id: "registry.near", price_usd: 500.0, price_source: "rhea", price_date: "2026-11-05", price_decimals: 6, depth_usd: 1.0, is_vetted: true}
          - {snapshot_date: "2026-11-05", token_id: "usdc-fake.near", price_usd: 0.25, price_source: "rhea", price_date: "2026-11-01", price_decimals: 6, depth_usd: 100.0, is_vetted: false}
          - {snapshot_date: "2026-11-05", token_id: "at-limit.near", price_usd: 1.0, price_source: "rhea", price_date: "2026-11-05", price_decimals: 6, depth_usd: 1.0, is_vetted: false}
          - {snapshot_date: "2026-11-05", token_id: "lambo.near", price_usd: 512.0, price_source: "rhea", price_date: "2026-11-01", price_decimals: 6, depth_usd: 4.0, is_vetted: false}
          - {snapshot_date: "2026-11-05", token_id: "no-pool.near", price_usd: 1.0, price_source: "rhea", price_date: "2026-11-05", price_decimals: 6, depth_usd: 0.0, is_vetted: false}
          - {snapshot_date: "2026-11-05", token_id: "no-decimals.near", price_usd: 1.0, price_source: "rhea", price_date: "2026-11-05", price_decimals: 6, depth_usd: 100.0, is_vetted: false}
          - {snapshot_date: "2026-11-05", token_id: "other-decimals.near", price_usd: 1.0, price_source: "rhea", price_date: "2026-11-05", price_decimals: 18, depth_usd: 100.0, is_vetted: false}
          - {snapshot_date: "2026-11-05", token_id: "far-apart.near", price_usd: 1.0, price_source: "oneclick", price_date: "2026-11-05", price_decimals: 6, price_gap_pct: 30.0, depth_usd: 100.0, is_vetted: true}
          - {snapshot_date: "2026-11-05", token_id: "near-enough.near", price_usd: 1.0, price_source: "oneclick", price_date: "2026-11-05", price_decimals: 6, price_gap_pct: 19.0, depth_usd: 100.0, is_vetted: true}
    expect:
      rows:
        - {snapshot_date: "2026-11-05", token_id: "native:near", price_usd: 4.0, price_source: "oneclick", price_date: "2026-11-05", value_usd: 8.0, value_status: "valued"}
        - {snapshot_date: "2026-11-05", token_id: "wrap.near", price_usd: 4.0, price_source: "oneclick", price_date: "2026-11-05", value_usd: 4.0, value_status: "valued"}
        # The price of 11-05 does not reach back to a snapshot with no price of its own.
        - {snapshot_date: "2026-10-28", token_id: "wrap.near", price_usd: null, price_source: null, price_date: null, value_usd: null, value_status: "no_price"}
        # On the registry, so a position far beyond its depth still counts.
        - {snapshot_date: "2026-11-05", token_id: "registry.near", price_usd: 500.0, price_source: "rhea", price_date: "2026-11-05", value_usd: 500.0, value_status: "valued"}
        # Valued at its own 0.25, not at USDC's 1.0.
        - {snapshot_date: "2026-11-05", token_id: "usdc-fake.near", price_usd: 0.25, price_source: "rhea", price_date: "2026-11-01", value_usd: 10.0, value_status: "valued"}
        # Exactly three times its depth is the last value allowed.
        - {snapshot_date: "2026-11-05", token_id: "at-limit.near", price_usd: 1.0, price_source: "rhea", price_date: "2026-11-05", value_usd: 3.0, value_status: "valued"}
