        - {snapshot_date: "2026-11-05", token_id: "no-decimals.near", price_usd: 1.0, price_source: "rhea", price_date: "2026-11-05", value_usd: null, value_status: "no_decimals"}
        - {snapshot_date: "2026-11-05", token_id: "nothing.near", price_usd: null, price_source: null, price_date: null, value_usd: null, value_status: "no_price"}
        - {snapshot_date: "2026-11-05", token_id: "other-decimals.near", price_usd: 1.0, price_source: "rhea", price_date: "2026-11-05", value_usd: null, value_status: "decimals_disagree"}
        - {snapshot_date: "2026-11-05", token_id: "far-apart.near", price_usd: 1.0, price_source: "oneclick", price_date: "2026-11-05", value_usd: null, value_status: "sources_disagree"}
        - {snapshot_date: "2026-11-05", token_id: "near-enough.near", price_usd: 1.0, price_source: "oneclick", price_date: "2026-11-05", value_usd: 1.0, value_status: "valued"}
