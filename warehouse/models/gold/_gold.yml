      - {name: origin_symbol, description: "Symbol of the asset paid in, per the 1Click token list.", meta: {unit: "text"}}
      - {name: origin_blockchain, description: "Chain of the asset paid in, per the 1Click token list.", meta: {unit: "text"}}
