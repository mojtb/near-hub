# Captures a snapshot every night on the data/nightly branch, so point-in-time data keeps building up.
# Keys are optional repository secrets; a source without its key is skipped with a clear message.
# BigQuery's key is a file, not a word: the secret GOOGLE_APPLICATION_CREDENTIALS_JSON holds the whole key file of a
# service account with the role BigQuery Job User. One step writes it outside the checkout, so it cannot be committed,
# and only the fetch that follows is told where it is. Without the secret the BigQuery datasets are skipped.
# main stays on its pinned snapshot, so the README's expected numbers do not drift.
# The dashboard's data (site/) and THESIS.md are rebuilt from each night's snapshot and committed with it, so the
# data/nightly branch always holds a site that matches its data. A failed site build never blocks the data commit.
#
# Each snapshot commit holds that night's code and data, pinned to that night, so it rebuilds by itself.
# It leaves out .github, because GitHub refuses a push from this job's token if it changes a workflow file.
#
# To test everything except the fetch in about two minutes: gh workflow run nightly.yml -f profile=none
# To fetch only some sources: gh workflow run nightly.yml -f sources=nrr_fund,rpc
name: Nightly snapshot

on:
  schedule:
    - cron: "23 1 * * *"
  workflow_dispatch:
    inputs:
      profile:
        description: "all, nightly or backfill. History jobs run in batches, so each night fills in a little more. none skips the fetch"
        default: all
      sources:
        description: "Comma-separated sources to fetch. Empty fetches them all"
        default: ""

permissions:
  contents: write

concurrency:
  group: nightly-snapshot

env:
  NEARBLOCKS_API_KEY: ${{ secrets.NEARBLOCKS_API_KEY }}
  NEARBLOCKS_RPM: ${{ vars.NEARBLOCKS_RPM }}
  FASTNEAR_API_KEY: ${{ secrets.FASTNEAR_API_KEY }}
  INTENTS_EXPLORER_JWT: ${{ secrets.INTENTS_EXPLORER_JWT }}
  DUNE_API_KEY: ${{ secrets.DUNE_API_KEY }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Bring in the data collected so far
        run: python -m tools.bring_in_nightly
      - run: make setup PYTHON=python
      - name: Let the fetch read BigQuery, if the repository holds a Google key
        if: inputs.profile != 'none'
        env:
          GOOGLE_KEY_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
        run: |
          if [ -n "$GOOGLE_KEY_JSON" ]; then
            printf '%s' "$GOOGLE_KEY_JSON" > "$RUNNER_TEMP/bigquery.json"
            chmod 600 "$RUNNER_TEMP/bigquery.json"
            echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/bigquery.json" >> "$GITHUB_ENV"
            .venv/bin/python -m pip install -q --disable-pip-version-check -r requirements-bigquery.txt
          else
            echo "No Google key in this repository's secrets: the BigQuery datasets will be skipped"
          fi
      - name: Fetch
        if: inputs.profile != 'none'
        env:
          SOURCES: ${{ inputs.sources }}
        run: .venv/bin/python -m ingest run --profile "${{ inputs.profile || 'all' }}" ${SOURCES:+--sources "$SOURCES"}
      - name: Build, document and fingerprint
        run: |
          date -u +%F > data/PINNED
          make warehouse fingerprints catalog
      - name: Rebuild the dashboard's data and the thesis from this snapshot
        id: site
        continue-on-error: true
        run: make site thesis
      - name: Verify
        id: verify
        continue-on-error: true
        run: make verify
      - name: Commit what was fetched, even if a check failed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs README.md site THESIS.md
          git rm -r -q --cached .github
          tree=$(git write-tree)
          parent=$(git rev-parse -q --verify origin/data/nightly || true)
          if [ "$tree" = "$(git rev-parse -q --verify "$parent^{tree}" || true)" ]; then
            echo "Nothing new to commit"
          else
            commit=$(git commit-tree "$tree" ${parent:+-p "$parent"} -m "Snapshot $(date -u +%F)")
            git push origin "$commit:refs/heads/data/nightly"
          fi
      - name: Report a failed check
        if: steps.verify.outcome == 'failure' || steps.site.outcome == 'failure'
        run: |
          echo "::error::make verify or the site build failed on this snapshot; the data was still committed so it can be inspected"
          exit 1
