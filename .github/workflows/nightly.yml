# Captures a snapshot every night on the data/nightly branch, so point-in-time data keeps building up.
# Keys are optional repository secrets; a source without its key is skipped with a clear message.
# main stays on its pinned snapshot, so the README's expected numbers do not drift.
#
# Each snapshot commit holds that night's code and data, pinned to that night, so it rebuilds by itself.
# It leaves out .github, because GitHub refuses a push from this job's token if it changes a workflow file.
#
# To test everything except the fetch in about two minutes: gh workflow run nightly.yml -f profile=none
name: Nightly snapshot

on:
  schedule:
    - cron: "23 1 * * *"
  workflow_dispatch:
    inputs:
      profile:
        description: "all, nightly or backfill. History jobs run in batches, so each night fills in a little more. none skips the fetch"
        default: all

permissions:
  contents: write

concurrency:
  group: nightly-snapshot

env:
  NEARBLOCKS_API_KEY: ${{ secrets.NEARBLOCKS_API_KEY }}
  FASTNEAR_API_KEY: ${{ secrets.FASTNEAR_API_KEY }}
  INTENTS_EXPLORER_JWT: ${{ secrets.INTENTS_EXPLORER_JWT }}
  DUNE_API_KEY: ${{ secrets.DUNE_API_KEY }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Bring in the data collected so far
        run: |
          if git rev-parse -q --verify origin/data/nightly; then
            git checkout origin/data/nightly -- data
          fi
      - run: make setup PYTHON=python
      - name: Fetch
        if: inputs.profile != 'none'
        run: .venv/bin/python -m ingest run --profile "${{ inputs.profile || 'all' }}"
      - name: Build, document and fingerprint
        run: |
          date -u +%F > data/PINNED
          make warehouse fingerprints catalog
      - name: Verify
        id: verify
        continue-on-error: true
        run: make verify
      - name: Commit what was fetched, even if a check failed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs README.md
          git rm -r -q --cached .github
          tree=$(git write-tree)
          parent=$(git rev-parse -q --verify origin/data/nightly || true)
          if [ "$tree" = "$(git rev-parse -q --verify "$parent^{tree}" || true)" ]; then
            echo "Nothing new to commit"
          else
            commit=$(git commit-tree "$tree" ${parent:+-p "$parent"} -m "Snapshot $(date -u +%F)")
            git push origin "$commit:refs/heads/data/nightly"
          fi
      - name: Report a failed check
        if: steps.verify.outcome == 'failure'
        run: |
          echo "::error::make verify failed on this snapshot; the data was still committed so it can be inspected"
          exit 1
