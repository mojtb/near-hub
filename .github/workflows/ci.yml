# Proves the judge path on a clean machine with no keys: setup, build from committed data, verify.
name: Reproducibility check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The same files must come out on every Python the Makefile accepts.
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: make setup PYTHON=python
      - run: make warehouse
      - run: make verify
      # The committed site, thesis and generated docs must be what the build writes from the committed data.
      - run: make catalog site thesis
      - run: git diff --exit-code

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t near-hub .
      - run: docker run --rm near-hub
